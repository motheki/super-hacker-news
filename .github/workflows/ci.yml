name: CI

on: [push, pull_request]

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .node-version

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.13

            - name: Install Aube
              run: npm install --global --ignore-scripts=false @endevco/aube@1.38.1

            - name: Install dependencies
              run: aube ci

            - name: Cache Next.js build output
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: .next/cache
                  key: ${{ runner.os }}-next-${{ hashFiles('aube-lock.yaml') }}-${{ hashFiles('src/**/*', 'public/**/*', 'next.config.ts', 'package.json', 'postcss.config.mjs') }}
                  restore-keys: |
                      ${{ runner.os }}-next-${{ hashFiles('aube-lock.yaml') }}-

            - name: Build
              run: aube run build

            - name: Test
              run: aube run test

            - name: Lint
              run: aube run lint
